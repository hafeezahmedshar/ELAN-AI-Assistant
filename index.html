<!-- ELAN 3D CHARACTER -->
<div id="elan3d">
  <canvas id="elanCanvas"></canvas>

  <div class="elanControls">
    <button onclick="elanStand()">Stand</button>
    <button onclick="elanSit()">Sit</button>
    <button onclick="elanTalk()">Talk</button>
    <button onclick="elanWave()">Wave</button>
    <button onclick="elanSmile()">Smile</button>
  </div>
</div>

<style>
#elan3d{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  z-index:999;
  background:radial-gradient(circle,#183b5e,#050b14 75%);
  overflow:hidden;
}

#elanCanvas{
  width:100%;
  height:100%;
  display:block;
}

.elanControls{
  position:absolute;
  bottom:25px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  justify-content:center;
}

.elanControls button{
  background:#172d45;
  border:1px solid #438ac4;
  color:white;
  padding:10px 14px;
  border-radius:14px;
}
</style>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

import {GLTFLoader} from
"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";

let scene;
let camera;
let renderer;
let elan;

let mixer;
let actions={};
let currentAction;

let bones={};
let faceMeshes=[];

const canvas=document.getElementById("elanCanvas");

scene=new THREE.Scene();

scene.background=new THREE.Color(0x050b14);

camera=new THREE.PerspectiveCamera(
  35,
  window.innerWidth/window.innerHeight,
  0.1,
  100
);

camera.position.set(0,1.55,4.2);

renderer=new THREE.WebGLRenderer({
  canvas:canvas,
  antialias:true,
  alpha:true
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.outputColorSpace=THREE.SRGBColorSpace;


/* LIGHT */

const keyLight=new THREE.DirectionalLight(
  0xffffff,
  2.5
);

keyLight.position.set(2,4,4);

scene.add(keyLight);


const fillLight=new THREE.DirectionalLight(
  0x75bfff,
  1.5
);

fillLight.position.set(-3,2,2);

scene.add(fillLight);


const ambient=new THREE.AmbientLight(
  0xffffff,
  1.2
);

scene.add(ambient);


/* LOAD ELAN MODEL */

const loader=new GLTFLoader();

loader.load(
  "elan.glb",

  function(gltf){

    elan=gltf.scene;

    scene.add(elan);

    elan.position.set(0,0,0);

    elan.scale.set(
      1,
      1,
      1
    );


    /* FIND BONES + FACE */

    elan.traverse(function(obj){

      if(obj.isBone){

        bones[obj.name.toLowerCase()]=obj;

      }

      if(obj.isMesh){

        obj.castShadow=true;

        obj.receiveShadow=true;

        if(
          obj.morphTargetDictionary &&
          obj.morphTargetInfluences
        ){

          faceMeshes.push(obj);

        }

      }

    });


    /* ANIMATIONS */

    mixer=new THREE.AnimationMixer(elan);

    gltf.animations.forEach(function(clip){

      actions[clip.name.toLowerCase()]=
        mixer.clipAction(clip);

    });


    playAnimation("idle");

  },

  undefined,

  function(error){

    console.log(
      "ELAN model load error:",
      error
    );

  }
);


/* ANIMATION PLAYER */

function playAnimation(name){

  if(!mixer)return;

  const action=actions[name.toLowerCase()];

  if(!action)return;

  if(currentAction===action)return;

  if(currentAction){

    currentAction.fadeOut(.25);

  }

  action.reset();

  action.fadeIn(.25);

  action.play();

  currentAction=action;
}


/* STANDING */

window.elanStand=function(){

  playAnimation("stand");

};


/* SITTING */

window.elanSit=function(){

  playAnimation("sit");

};


/* TALKING */

window.elanTalk=function(){

  playAnimation("talk");

};


/* WAVE */

window.elanWave=function(){

  playAnimation("wave");

};


/* SMILE */

window.elanSmile=function(){

  setFace("smile",1);

  setTimeout(function(){

    setFace("smile",0);

  },1200);

};


/* FACIAL CONTROL */

function setFace(name,value){

  name=name.toLowerCase();

  faceMeshes.forEach(function(mesh){

    const dict=mesh.morphTargetDictionary;

    const influence=mesh.morphTargetInfluences;

    for(const key in dict){

      if(
        key.toLowerCase().includes(name)
      ){

        influence[dict[key]]=value;

      }

    }

  });

}


/* NATURAL BLINK */

function blink(){

  setFace("blink",1);

  setTimeout(function(){

    setFace("blink",0);

  },120);

}

setInterval(function(){

  blink();

},3500);


/* NATURAL HEAD MOVEMENT */

function naturalMovement(time){

  if(!elan)return;

  const head=
    bones["head"] ||
    bones["head_end"];

  const neck=
    bones["neck"];

  if(head){

    head.rotation.y=
      Math.sin(time*0.0007)*0.06;

    head.rotation.x=
      Math.sin(time*0.0009)*0.025;

  }

  if(neck){

    neck.rotation.y=
      Math.sin(time*0.0006)*0.025;

  }

}


/* UPDATE */

const clock=new THREE.Clock();

function animate(time){

  requestAnimationFrame(animate);

  const delta=clock.getDelta();

  if(mixer){

    mixer.update(delta);

  }

  naturalMovement(time);

  renderer.render(
    scene,
    camera
  );

}

animate(0);


/* RESIZE */

window.addEventListener(
  "resize",
  function(){

    camera.aspect=
      window.innerWidth/
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);

 </script>
