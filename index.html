<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ELAN AI Assistant</title>

<style>
*{box-sizing:border-box}

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 background:#050b14;
 font-family:Arial,sans-serif;
}

#elan{
 position:fixed;
 inset:0;
 width:100vw;
 height:100vh;
 overflow:hidden;
 background:#050b14;
}

#elan img{
 width:100%;
 height:100%;
 object-fit:cover;
 object-position:center;
 display:block;
 transition:transform .45s ease,filter .45s ease;
 animation:breath 4s ease-in-out infinite;
}

@keyframes breath{
 0%,100%{transform:scale(1) translateY(0)}
 50%{transform:scale(1.012) translateY(-4px)}
}

.talking{
 animation:talk .22s ease-in-out infinite alternate!important;
}

@keyframes talk{
 from{transform:scale(1.012) translateY(-3px)}
 to{transform:scale(1.025) translateY(-7px)}
}

.wave{
 animation:wave 1.2s ease-in-out infinite alternate!important;
}

@keyframes wave{
 from{transform:rotate(-1deg) scale(1.01)}
 to{transform:rotate(1deg) scale(1.025)}
}

.sit{
 transform:scale(1.08) translateY(3%)!important;
}

.smile{
 filter:brightness(1.08) saturate(1.12);
 transform:scale(1.025);
}

.controls{
 position:absolute;
 bottom:22px;
 left:50%;
 transform:translateX(-50%);
 display:flex;
 flex-wrap:wrap;
 justify-content:center;
 gap:8px;
 width:94%;
 z-index:5;
}

button{
 border:1px solid #55b8ff;
 background:rgba(8,28,50,.88);
 color:white;
 padding:11px 15px;
 border-radius:16px;
 font-size:14px;
 box-shadow:0 0 12px rgba(70,170,255,.25);
}

button:active{
 transform:scale(.94);
}
</style>
</head>

<body>

<div id="elan">

<img id="elanImage"
src="elan-fullscreen.png"
onerror="this.src='elan-avatar.png'">

<div class="controls">
<button onclick="stand()">Stand</button>
<button onclick="sit()">Sit</button>
<button onclick="talk()">Talk</button>
<button onclick="wave()">Wave</button>
<button onclick="smile()">Smile</button>
</div>

</div>

<script>

const img=document.getElementById("elanImage");

function reset(){
 img.className="";
}

function stand(){
 reset();
}

function sit(){
 reset();
 img.classList.add("sit");
}

function talk(){
 reset();
 img.classList.add("talking");

 setTimeout(()=>{
   img.classList.remove("talking");
 },4000);
}

function wave(){
 reset();
 img.classList.add("wave");

 setTimeout(()=>{
   img.classList.remove("wave");
 },3500);
}

function smile(){
 reset();
 img.classList.add("smile");

 setTimeout(()=>{
   img.classList.remove("smile");
 },1800);
}

/* natural idle movement */

setInterval(()=>{
 if(!img.className){
   img.style.filter=
     "brightness("+(1+Math.random()*0.025)+")";
 }
},1800);

</script>

</body>
</html>
